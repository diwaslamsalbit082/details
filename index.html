<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Let's Connect</title>
<meta name="description" content="Find me on social media or get in touch." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#05060b;
    --bg-1:#0a0d1a;
    --bg-2:#0d1122;
    --ink-0:#f4f2ec;
    --ink-1:#aab0c4;
    --ink-2:#6b7189;
    --gold:#f0b93d;
    --gold-soft:#f7d488;
    --violet:#8c7bf0;
    --cyan:#57e0c9;
    --hairline:rgba(255,255,255,0.09);
    --glass:rgba(255,255,255,0.045);
    --radius:18px;
  }

  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    height:100%;
    background:var(--bg-0);
    color:var(--ink-0);
    font-family:'Manrope', sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }

  body{
    min-height:100svh;
    display:flex;
    flex-direction:column;
    position:relative;
    background:
      radial-gradient(ellipse 70% 50% at 50% 0%, rgba(140,123,240,0.10), transparent 60%),
      radial-gradient(ellipse 60% 40% at 50% 100%, rgba(240,185,61,0.08), transparent 60%),
      linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 45%, var(--bg-2) 100%);
  }

  /* ---------- starfield ---------- */
  #stars{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
  }
  .star-layer{
    position:absolute;
    inset:0;
    border-radius:50%;
    background:transparent;
  }
  .star-layer.a{ animation: twinkle 4.5s ease-in-out infinite; }
  .star-layer.b{ animation: twinkle 6.5s ease-in-out infinite 1.2s; }
  @keyframes twinkle{
    0%,100%{ opacity:0.35; }
    50%{ opacity:1; }
  }

  /* ---------- fireworks canvas ---------- */
  #fireworks{
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;
    width:100%;
    height:100%;
  }

  /* ---------- layout ---------- */
  .stage{
    position:relative;
    z-index:2;
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:100svh;
    padding:8vh 20px 14vh;
    text-align:center;
  }

  .avatar{
    width:64px;
    height:64px;
    border-radius:50%;
    margin-bottom:26px;
    background:
      radial-gradient(circle at 35% 30%, rgba(255,255,255,0.9), rgba(240,185,61,0.35) 45%, rgba(140,123,240,0.25) 100%);
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.12),
      0 0 40px rgba(240,185,61,0.25),
      0 0 80px rgba(140,123,240,0.15);
    opacity:0;
    transform:translateY(14px) scale(0.9);
    animation: reveal 0.9s cubic-bezier(.2,.8,.2,1) 0.05s forwards;
  }

  h1{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-optical-sizing:auto;
    font-size:clamp(2.4rem, 6vw, 3.6rem);
    letter-spacing:-0.01em;
    line-height:1.05;
    margin:0 0 14px;
    color:var(--ink-0);
    opacity:0;
    transform:translateY(14px);
    animation: reveal 0.9s cubic-bezier(.2,.8,.2,1) 0.18s forwards;
  }

  h1 em{
    font-style:italic;
    background:linear-gradient(100deg, var(--gold-soft), var(--violet) 85%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  .subtitle{
    font-size:clamp(0.95rem, 2vw, 1.05rem);
    color:var(--ink-1);
    max-width:34ch;
    margin:0 0 46px;
    line-height:1.6;
    font-weight:400;
    opacity:0;
    transform:translateY(14px);
    animation: reveal 0.9s cubic-bezier(.2,.8,.2,1) 0.3s forwards;
  }

  @keyframes reveal{
    to{ opacity:1; transform:translateY(0); }
  }

  /* ---------- contact list ---------- */
  .contacts{
    width:100%;
    max-width:440px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .card{
    --glow: var(--violet);
    position:relative;
    display:flex;
    align-items:center;
    gap:16px;
    padding:16px 18px;
    text-decoration:none;
    color:var(--ink-0);
    background:var(--glass);
    border:1px solid var(--hairline);
    border-radius:var(--radius);
    backdrop-filter:blur(18px) saturate(140%);
    -webkit-backdrop-filter:blur(18px) saturate(140%);
    overflow:hidden;
    isolation:isolate;
    cursor:pointer;
    opacity:0;
    transform:translateY(14px);
    animation: reveal 0.8s cubic-bezier(.2,.8,.2,1) forwards;
    transition: transform 0.35s cubic-bezier(.2,.8,.2,1), border-color 0.35s ease, box-shadow 0.4s ease;
  }
  .contacts .card:nth-child(1){ animation-delay:0.42s; }
  .contacts .card:nth-child(2){ animation-delay:0.5s; }
  .contacts .card:nth-child(3){ animation-delay:0.58s; }
  .contacts .card:nth-child(4){ animation-delay:0.66s; }

  .card::before{
    content:"";
    position:absolute;
    inset:0;
    z-index:-1;
    opacity:0;
    background:radial-gradient(120px 80px at 15% 50%, var(--glow), transparent 70%);
    transition:opacity 0.4s ease;
  }

  .card:hover,
  .card:focus-visible{
    transform:translateY(-4px) scale(1.015);
    border-color:rgba(255,255,255,0.22);
    box-shadow:
      0 14px 34px rgba(0,0,0,0.35),
      0 0 0 1px rgba(255,255,255,0.05) inset,
      0 0 30px -4px var(--glow);
  }
  .card:hover::before,
  .card:focus-visible::before{ opacity:0.55; }

  .card:focus-visible{
    outline:2px solid var(--gold-soft);
    outline-offset:3px;
  }

  .card:active{ transform:translateY(-1px) scale(0.99); }

  .icon-wrap{
    flex:0 0 auto;
    width:46px;
    height:46px;
    border-radius:13px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.08);
    color:var(--glow);
    transition:transform 0.35s cubic-bezier(.2,.8,.2,1), color 0.35s ease;
  }
  .card:hover .icon-wrap{ transform:rotate(-6deg) scale(1.08); }
  .icon-wrap svg{ width:22px; height:22px; }

  .card-text{
    flex:1;
    min-width:0;
    text-align:left;
  }
  .platform{
    display:block;
    font-size:0.98rem;
    font-weight:600;
    color:var(--ink-0);
    margin-bottom:2px;
  }
  .handle{
    display:block;
    font-size:0.85rem;
    color:var(--ink-1);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .go{
    flex:0 0 auto;
    width:18px;
    height:18px;
    color:var(--ink-2);
    transform:translateX(0) rotate(0deg);
    transition:transform 0.35s cubic-bezier(.2,.8,.2,1), color 0.35s ease;
  }
  .card:hover .go{ transform:translateX(3px) rotate(45deg); color:var(--ink-0); }

  /* per-platform accent */
  .card.fb{ --glow:#6f8cff; }
  .card.ig{ --glow:#f0729a; }
  .card.tt{ --glow:#57e0c9; }
  .card.em{ --glow:#f0b93d; }

  /* ripple */
  .ripple{
    position:absolute;
    border-radius:50%;
    background:rgba(255,255,255,0.28);
    transform:scale(0);
    animation:ripple-anim 0.6s ease-out forwards;
    pointer-events:none;
  }
  @keyframes ripple-anim{
    to{ transform:scale(1); opacity:0; }
  }

  footer{
    position:relative;
    z-index:2;
    text-align:center;
    padding:22px 20px 28px;
    font-size:0.78rem;
    color:var(--ink-2);
    letter-spacing:0.01em;
  }
  footer span{ color:var(--gold-soft); }

  @media (max-width:420px){
    .stage{ padding:7vh 16px 12vh; }
    .card{ padding:14px 15px; gap:13px; }
    .icon-wrap{ width:42px; height:42px; }
  }

  @media (prefers-reduced-motion: reduce){
    .avatar,h1,.subtitle,.card{
      animation:none !important;
      opacity:1 !important;
      transform:none !important;
    }
    .card{ transition:none; }
  }
</style>
</head>
<body>

<div id="stars" aria-hidden="true"></div>
<canvas id="fireworks" aria-hidden="true"></canvas>

<main class="stage">
  <div class="avatar" role="presentation"></div>
  <h1>Let&rsquo;s <em>connect</em></h1>
  <p class="subtitle">Find me on social media, or drop a line by email &mdash; I&rsquo;d love to hear from you.</p>

  <nav class="contacts" aria-label="Social and contact links">
    <a class="card fb" href="https://facebook.com/yourname" target="_blank" rel="noopener noreferrer">
      <span class="icon-wrap" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.5 21v-7.9h2.65l.4-3.08h-3.05V8.06c0-.89.25-1.5 1.53-1.5h1.63V3.8A22 22 0 0 0 14 3.6c-2.4 0-4.05 1.46-4.05 4.15v2.32H7.3v3.08h2.65V21h3.55Z"/></svg>
      </span>
      <span class="card-text">
        <span class="platform">Facebook</span>
        <span class="handle">facebook.com/yourname</span>
      </span>
      <svg class="go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 17 17 7M9 7h8v8"/></svg>
    </a>

    <a class="card ig" href="https://instagram.com/yourname" target="_blank" rel="noopener noreferrer">
      <span class="icon-wrap" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17" cy="7" r="1" fill="currentColor" stroke="none"/></svg>
      </span>
      <span class="card-text">
        <span class="platform">Instagram</span>
        <span class="handle">@yourname</span>
      </span>
      <svg class="go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 17 17 7M9 7h8v8"/></svg>
    </a>

    <a class="card tt" href="https://tiktok.com/@yourname" target="_blank" rel="noopener noreferrer">
      <span class="icon-wrap" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.6 3c.4 2.2 1.9 3.9 4.1 4.2v2.9c-1.5.1-2.9-.4-4.1-1.2v6.8c0 3.1-2.5 5.6-5.6 5.6a5.6 5.6 0 0 1-1.1-11.1v3c-.3-.1-.6-.2-1-.2a2.6 2.6 0 1 0 2.6 2.6V3h5.1Z"/></svg>
      </span>
      <span class="card-text">
        <span class="platform">TikTok</span>
        <span class="handle">@yourname</span>
      </span>
      <svg class="go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 17 17 7M9 7h8v8"/></svg>
    </a>

    <a class="card em" href="mailto:you@email.com">
      <span class="icon-wrap" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="5" width="17" height="14" rx="3"/><path d="m4.5 6.5 7.5 6 7.5-6"/></svg>
      </span>
      <span class="card-text">
        <span class="platform">Email</span>
        <span class="handle">you@email.com</span>
      </span>
      <svg class="go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 17 17 7M9 7h8v8"/></svg>
    </a>
  </nav>
</main>

<footer>Made with <span>&hearts;</span> &bull; &copy; 2026</footer>

<script>
(() => {
  "use strict";

  /* ============ starfield (lightweight, CSS-driven) ============ */
  function buildStars(){
    const wrap = document.getElementById('stars');
    wrap.innerHTML = '';
    const count = window.innerWidth < 640 ? 70 : 130;
    const layers = [
      {cls:'a', n:Math.round(count*0.6), size:1},
      {cls:'b', n:Math.round(count*0.4), size:2}
    ];
    layers.forEach(layer => {
      let shadows = [];
      for(let i=0;i<layer.n;i++){
        const x = Math.round(Math.random()*100);
        const y = Math.round(Math.random()*100);
        shadows.push(`${x}vw ${y}vh 0 rgba(255,255,255,${(Math.random()*0.5+0.3).toFixed(2)})`);
      }
      const el = document.createElement('div');
      el.className = 'star-layer ' + layer.cls;
      el.style.width = layer.size + 'px';
      el.style.height = layer.size + 'px';
      el.style.boxShadow = shadows.join(',');
      wrap.appendChild(el);
    });
  }
  buildStars();
  let starResizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(starResizeTimer);
    starResizeTimer = setTimeout(buildStars, 400);
  });

  /* ============ ripple feedback on cards ============ */
  document.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', function(e){
      const rect = this.getBoundingClientRect();
      const size = Math.max(rect.width, rect.height) * 1.4;
      const ripple = document.createElement('span');
      ripple.className = 'ripple';
      ripple.style.width = ripple.style.height = size + 'px';
      ripple.style.left = (e.clientX - rect.left - size/2) + 'px';
      ripple.style.top = (e.clientY - rect.top - size/2) + 'px';
      this.appendChild(ripple);
      ripple.addEventListener('animationend', () => ripple.remove());
    });
  });

  /* ============ fireworks engine ============ */
  const canvas = document.getElementById('fireworks');
  const ctx = canvas.getContext('2d', { alpha: true });
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const isSmall = () => window.innerWidth < 700;

  let W, H, DPR;
  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  resize();
  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resize, 200);
  });

  const PALETTE = [
    '#f0b93d', '#f7d488', '#8c7bf0', '#57e0c9',
    '#f0729a', '#6f8cff', '#ffe27a', '#ff9d5c'
  ];
  const rand = (a,b) => a + Math.random()*(b-a);
  const pick = arr => arr[(Math.random()*arr.length)|0];

  class Particle{
    constructor(x,y,vx,vy,color,life,size){
      this.x=x; this.y=y; this.vx=vx; this.vy=vy;
      this.color=color;
      this.life=life; this.maxLife=life;
      this.size=size;
      this.gravity=0.045;
      this.drag=0.985;
    }
    update(dt){
      this.vx *= this.drag;
      this.vy = this.vy*this.drag + this.gravity*dt;
      this.x += this.vx*dt;
      this.y += this.vy*dt;
      this.life -= dt;
      return this.life > 0;
    }
    draw(ctx){
      const t = Math.max(this.life/this.maxLife, 0);
      ctx.globalAlpha = t;
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size*Math.max(t,0.15), 0, Math.PI*2);
      ctx.fill();
    }
  }

  function explosionVectors(shape, count){
    const vecs = [];
    switch(shape){
      case 'circle': {
        for(let i=0;i<count;i++){
          const a = (i/count)*Math.PI*2 + rand(-0.05,0.05);
          const s = rand(2.4,4.2);
          vecs.push([Math.cos(a)*s, Math.sin(a)*s]);
        }
        break;
      }
      case 'ring': {
        for(let i=0;i<count;i++){
          const a = (i/count)*Math.PI*2;
          const s = 4.4;
          vecs.push([Math.cos(a)*s, Math.sin(a)*s]);
        }
        break;
      }
      case 'star': {
        const spikes = 5;
        for(let i=0;i<count;i++){
          const spike = i % spikes;
          const base = (spike/spikes)*Math.PI*2;
          const jitter = rand(-0.12,0.12);
          const a = base + jitter;
          const s = (i % 3 === 0) ? rand(4.2,5.2) : rand(1.6,2.6);
          vecs.push([Math.cos(a-Math.PI/2)*s, Math.sin(a-Math.PI/2)*s]);
        }
        break;
      }
      case 'heart': {
        for(let i=0;i<count;i++){
          const t = (i/count)*Math.PI*2;
          let x = 16*Math.pow(Math.sin(t),3);
          let y = -(13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t));
          x/=16; y/=16;
          const s = rand(3.0,3.6);
          vecs.push([x*s, y*s]);
        }
        break;
      }
      case 'spiral': {
        const turns = 3;
        for(let i=0;i<count;i++){
          const t = i/count;
          const a = t*Math.PI*2*turns;
          const s = 1 + t*3.6;
          vecs.push([Math.cos(a)*s, Math.sin(a)*s]);
        }
        break;
      }
      case 'burst': {
        for(let i=0;i<count;i++){
          const a = rand(0,Math.PI*2);
          const s = rand(1.5,5.4);
          vecs.push([Math.cos(a)*s, Math.sin(a)*s]);
        }
        break;
      }
      default: { // random/custom
        for(let i=0;i<count;i++){
          const a = rand(0,Math.PI*2);
          const s = rand(0.8,4.8) * (Math.random()<0.15 ? 1.6 : 1);
          vecs.push([Math.cos(a)*s, Math.sin(a)*s]);
        }
      }
    }
    return vecs;
  }

  const SHAPES = ['circle','star','heart','ring','spiral','burst','random'];

  let particles = [];
  let rockets = [];
  const MAX_PARTICLES = isSmall() ? 260 : 460;

  class Rocket{
    constructor(){
      const originX = W/2 + rand(-W*0.18, W*0.18);
      this.x = originX;
      this.y = H + 10;
      this.targetY = rand(H*0.18, H*0.55);
      const dist = this.y - this.targetY;
      this.vy = -rand(9.5, 12.5);
      this.vx = rand(-0.6,0.6);
      this.color = pick(PALETTE);
      this.trail = [];
      this.dead = false;
    }
    update(dt){
      this.trail.push([this.x,this.y]);
      if(this.trail.length > 10) this.trail.shift();
      this.x += this.vx*dt;
      this.y += this.vy*dt;
      this.vy += 0.02*dt;
      if(this.y <= this.targetY || this.vy >= -0.5){
        this.explode();
        this.dead = true;
      }
      return !this.dead;
    }
    explode(){
      if(particles.length > MAX_PARTICLES) return;
      const shape = pick(SHAPES);
      const budget = Math.max(0, MAX_PARTICLES - particles.length);
      const count = Math.min(isSmall()? rand(24,36) : rand(34,54), budget);
      const vecs = explosionVectors(shape, Math.floor(count));
      const life = rand(50,80);
      const baseColor = Math.random() < 0.35 ? pick(PALETTE) : this.color;
      vecs.forEach(([vx,vy]) => {
        const c = Math.random() < 0.25 ? pick(PALETTE) : baseColor;
        particles.push(new Particle(
          this.x, this.y,
          vx*rand(0.85,1.15), vy*rand(0.85,1.15),
          c, life*rand(0.8,1.15), rand(1.4,2.6)
        ));
      });
    }
    draw(ctx){
      ctx.globalAlpha = 1;
      for(let i=0;i<this.trail.length;i++){
        const [tx,ty] = this.trail[i];
        ctx.globalAlpha = (i/this.trail.length)*0.5;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(tx,ty, 1.6, 0, Math.PI*2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(this.x,this.y,2,0,Math.PI*2);
      ctx.fill();
    }
  }

  let lastLaunch = 0;
  let nextInterval = rand(700, 1600);
  const maxRockets = isSmall() ? 2 : 4;

  function maybeLaunch(now){
    if(reduceMotion) return;
    if(now - lastLaunch > nextInterval && rockets.length < maxRockets){
      rockets.push(new Rocket());
      lastLaunch = now;
      nextInterval = rand(650, 1700);
    }
  }

  let last = performance.now();
  let paused = document.hidden;

  function frame(now){
    requestAnimationFrame(frame);
    if(paused) { last = now; return; }
    const dt = Math.min((now-last)/16.67, 2.2);
    last = now;

    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(5,6,11,0.22)';
    ctx.fillRect(0,0,W,H);

    ctx.globalCompositeOperation = 'lighter';

    maybeLaunch(now);

    rockets = rockets.filter(r => { r.draw(ctx); return r.update(dt); });
    particles = particles.filter(p => { const alive = p.update(dt); if(alive) p.draw(ctx); return alive; });

    ctx.globalAlpha = 1;
  }

  document.addEventListener('visibilitychange', () => { paused = document.hidden; });

  if(reduceMotion){
    // gentle static-ish sky: draw a couple of soft glows once, no continuous bursts
    ctx.globalCompositeOperation = 'lighter';
    for(let i=0;i<3;i++){
      const x = W*rand(0.3,0.7), y = H*rand(0.15,0.4);
      const g = ctx.createRadialGradient(x,y,0,x,y,90);
      g.addColorStop(0, pick(PALETTE)+'aa');
      g.addColorStop(1, 'transparent');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x,y,90,0,Math.PI*2); ctx.fill();
    }
  } else {
    requestAnimationFrame(frame);
  }
})();
</script>
